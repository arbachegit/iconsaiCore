name: Deploy Skills Catalog

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/deploy-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-skills-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  DEPLOY_PATH: /opt/skills/app
  SERVICE_NAME: iconsai-skills

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: skills/package-lock.json

      - run: npm ci

      - name: Stamp build
        run: git rev-parse HEAD > public/build-info.txt

      - name: Build standalone app
        run: npm run build
        env:
          NEXT_PUBLIC_TOOLS_ORIGIN: https://tools.iconsai.ai/admin
          GITHUB_OWNER: arbachegit
          GITHUB_REPO: iconsaiConfig
          GITHUB_TOKEN: ${{ secrets.SKILLS_GITHUB_TOKEN }}

      - name: Assemble standalone artifact
        run: |
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public

      - uses: actions/upload-artifact@v4
        with:
          name: skills-${{ github.sha }}
          path: skills/.next/standalone/
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: skills-${{ github.sha }}
          path: build

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SKILLS_SSH_PRIVATE_KEY }}" > ~/.ssh/skills_key
          chmod 600 ~/.ssh/skills_key
          ssh-keyscan -H "${{ secrets.SKILLS_SERVER_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host skills-server
            HostName ${{ secrets.SKILLS_SERVER_HOST }}
            User ${{ secrets.SKILLS_SERVER_USER }}
            IdentityFile ~/.ssh/skills_key
            ControlMaster auto
            ControlPath /tmp/skills-ssh-%C
            ControlPersist 10m
            ConnectTimeout 15
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          for attempt in 1 2 3 4 5; do
            ssh -MNf skills-server && exit 0
            sleep 10
          done
          exit 1

      - name: Publish standalone with static assets
        run: |
          rsync -az --delete --exclude='.env.production' \
            -e ssh \
            build/ \
            "skills-server:${{ env.DEPLOY_PATH }}/"

      - name: Install service and Caddy host
        env:
          SKILLS_PORT: ${{ vars.SKILLS_PORT }}
          SKILLS_PUBLIC_URL: ${{ vars.SKILLS_PUBLIC_URL }}
          SKILLS_TOOLS_VERIFY_URL: ${{ vars.SKILLS_TOOLS_VERIFY_URL }}
          SKILLS_TOOLS_ENTRY_URL: ${{ vars.SKILLS_TOOLS_ENTRY_URL }}
          SKILLS_TOOLS_COURSE_SLUG: ${{ vars.SKILLS_TOOLS_COURSE_SLUG }}
        run: |
          test -n "$SKILLS_PORT"
          test -n "$SKILLS_PUBLIC_URL"
          test -n "$SKILLS_TOOLS_VERIFY_URL"
          test -n "$SKILLS_TOOLS_ENTRY_URL"
          test -n "$SKILLS_TOOLS_COURSE_SLUG"
          case "$SKILLS_TOOLS_VERIFY_URL" in
            https://*/api/tools-auth/verify) ;;
            *) echo 'SKILLS_TOOLS_VERIFY_URL precisa apontar para /api/tools-auth/verify'; exit 1 ;;
          esac
          {
            printf 'SKILLS_PUBLIC_URL=%s\n' "$SKILLS_PUBLIC_URL"
            printf 'SKILLS_TOOLS_VERIFY_URL=%s\n' "$SKILLS_TOOLS_VERIFY_URL"
            printf 'SKILLS_TOOLS_ENTRY_URL=%s\n' "$SKILLS_TOOLS_ENTRY_URL"
            printf 'SKILLS_TOOLS_COURSE_SLUG=%s\n' "$SKILLS_TOOLS_COURSE_SLUG"
          } > /tmp/skills-runtime.env
          timeout 45s rsync -az -e ssh \
            skills/deploy/iconsai-skills.service \
            "skills-server:/tmp/iconsai-skills.service"
          timeout 45s rsync -az -e ssh \
            /tmp/skills-runtime.env \
            "skills-server:/tmp/skills-runtime.env"
          sed "s/{\$SKILLS_PORT}/$SKILLS_PORT/g" skills/deploy/skills.caddy > /tmp/skills.caddy
          timeout 45s rsync -az -e ssh \
            /tmp/skills.caddy \
            "skills-server:/tmp/skills.caddy"
          timeout 60s ssh skills-server <<'REMOTE'
            set -e
            touch /opt/skills/app/.env.production
            sed -i '/^SKILLS_PUBLIC_URL=/d;/^SKILLS_TOOLS_VERIFY_URL=/d;/^SKILLS_TOOLS_ENTRY_URL=/d;/^SKILLS_TOOLS_COURSE_SLUG=/d' /opt/skills/app/.env.production
            cat /tmp/skills-runtime.env >> /opt/skills/app/.env.production
            chmod 600 /opt/skills/app/.env.production
            install -m 644 /tmp/iconsai-skills.service /etc/systemd/system/iconsai-skills.service
            install -m 644 /tmp/skills.caddy /etc/caddy/skills.caddy
            grep -qxF 'import /etc/caddy/skills.caddy' /etc/caddy/Caddyfile || \
              printf '\nimport /etc/caddy/skills.caddy\n' >> /etc/caddy/Caddyfile
            caddy validate --config /etc/caddy/Caddyfile
            systemctl daemon-reload
            systemctl enable --now iconsai-skills
            systemctl restart iconsai-skills
            systemctl reload caddy
          REMOTE

      - name: Verify public build and assets
        run: |
          ssh skills-server "EXPECTED='${{ github.sha }}' bash -s" <<'REMOTE'
            set -euo pipefail
            curl_public=(curl --globoff --resolve skill.iconsai.ai:443:127.0.0.1 --connect-timeout 5 --max-time 20)
            actual=$("${curl_public[@]}" -fsS --retry 12 --retry-delay 2 --retry-all-errors \
              https://skill.iconsai.ai/build-info.txt)
            test "$actual" = "$EXPECTED"
            status=$("${curl_public[@]}" -sS -o /dev/null -w '%{http_code}' https://skill.iconsai.ai/)
            test "$status" = '307'
            paths=$(find /opt/skills/app/.next/static -type f \( -name '*.js' -o -name '*.css' \) \
              | sed 's#^/opt/skills/app/.next/static#/_next/static#' | sort -u)
            test -n "$paths"
            while IFS= read -r path; do
              status=$("${curl_public[@]}" -sS -o /dev/null -w '%{http_code}' \
                "https://skill.iconsai.ai$path")
              test "$status" = '200'
            done <<< "$paths"
            api_status=$("${curl_public[@]}" -sS -o /dev/null -w '%{http_code}' \
              https://skill.iconsai.ai/api/skills/finalizar/doc)
            test "$api_status" = '401'
          REMOTE

      - if: always()
        run: |
          ssh -O exit skills-server 2>/dev/null || true
          rm -f ~/.ssh/skills_key ~/.ssh/config /tmp/skills.caddy /tmp/skills-runtime.env
